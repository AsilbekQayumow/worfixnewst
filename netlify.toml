# WORFIX on Netlify. The Next.js app lives in web/; Netlify detects Next.js and installs its
# runtime automatically (pages are pre-rendered, /api/ai/missions runs as a serverless function).
#
# Set these in Netlify → Site configuration → Environment variables BEFORE the first deploy:
#   NEXT_PUBLIC_FIREBASE_*         already set below for project worfix3 (public values); change them there for another project
#   GEMINI_API_KEY                 server-only: GPS mission agent and photo check
#   ORS_API_KEY                    server-only: walking routes and place search (openrouteservice.org)
#   FIREBASE_SERVICE_ACCOUNT       server-only (v3): service-account JSON; lets the AI review agent missions and write
#                                  rewards, deliver promo codes instantly and run the daily territory decay (v3.2)
# Sign-in is by email only (v3.2): TELEGRAM_BOT_TOKEN / NEXT_PUBLIC_TELEGRAM_BOT are no longer used and can be deleted.
# A production deploy without the Firebase values stops with a clear message (web/scripts/check-env.mjs),
# so the live site never opens in demo mode by accident. Step-by-step guide: DEPLOY.md.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  # Firebase web config of project worfix3. These values are public by design (they ship to every browser);
  # data is protected by firestore.rules, not by hiding them. Server secrets (GEMINI_API_KEY, ORS_API_KEY)
  # are NOT here: set them in Netlify → Environment variables as Secrets.
  NEXT_PUBLIC_FIREBASE_API_KEY = "AIzaSyDyOoQ9mFXuMLVdKGrm0YKCeuJ7AfKfDS0"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = "worfix3.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID = "worfix3"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET = "worfix3.firebasestorage.app"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "351884326312"
  NEXT_PUBLIC_FIREBASE_APP_ID = "1:351884326312:web:3c6a2e4f5eab119167199d"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"

# AI and map endpoints run as their own functions (60 s limit); the Next.js server handler stops at 10 s.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # The Admin SDK (ai-review, shop-fulfil, territory-decay) is installed as a normal dependency, not bundled.
  external_node_modules = ["firebase-admin"]

# Next.js runtime (server-rendered pages and /api routes). Declared explicitly so it also runs
# for deploys uploaded through the API/CLI, not only for Git-triggered builds.
[[plugins]]
  package = "@netlify/plugin-nextjs"
