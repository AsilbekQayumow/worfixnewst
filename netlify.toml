# WORFIX on Netlify. The Next.js app lives in web/; Netlify detects Next.js and installs its
# runtime automatically (pages are pre-rendered, /api/ai/missions runs as a serverless function).
#
# Set these in Netlify → Site configuration → Environment variables BEFORE the first deploy:
#   NEXT_PUBLIC_FIREBASE_*         the six values from Firebase console → Project settings → Your apps (web)
#   GEMINI_API_KEY                 server-only: GPS mission agent and photo check
#   ORS_API_KEY                    server-only: walking routes and place search (openrouteservice.org)
# A production deploy without the Firebase values stops with a clear message (web/scripts/check-env.mjs),
# so the live site never opens in demo mode by accident. Step-by-step guide: DEPLOY.md.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"

# AI and map endpoints run as their own functions (60 s limit); the Next.js server handler stops at 10 s.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Next.js runtime (server-rendered pages and /api routes). Declared explicitly so it also runs
# for deploys uploaded through the API/CLI, not only for Git-triggered builds.
[[plugins]]
  package = "@netlify/plugin-nextjs"
